services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ""
    ports:
      - "8000:8000"
    volumes:
      - fraudguard_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  fraudguard_data:
